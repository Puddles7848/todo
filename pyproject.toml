[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "To-do"
version = "1.0"
dependencies = [
    "argparse",
    "json",
    "os",
    "subprocess",
    "sys",
    "pathlib",
    "typing"
]
authors = [{name = "Rahul Aryan", email = "puddles7848@gmail.com"},]
readme = "README.md"
license = "GPL-3.0-only"
keywords = ["todo", "qol"]
requires-python = ">=3.9"

[project.scripts]
todo = "todo:main"

[tool.setuptools]
py-modules = ["todo"]
